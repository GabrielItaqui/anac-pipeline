[project]
name = "anac-pipeline"
version = "0.1.0"
description = "Pipeline de dados (raw → refined → marts) sobre a pontualidade da aviação doméstica brasileira em 2025, com dados abertos da ANAC."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
]

[dependency-groups]
dashboard = [
    "streamlit>=1.66.1",
]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
